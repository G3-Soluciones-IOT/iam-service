spring.application.name=iam-service
server.port=${SERVER_PORT:8081}
spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://config-service:8888}
spring.cloud.config.retry.max-attempts=20
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=3000
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:iam_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:password}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-service:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:iam-service}
eureka.instance.instance-id=${spring.application.name}:${server.port}

authorization.password.bcrypt.strength=${IAM_BCRYPT_STRENGTH:12}
authorization.jwt.issuer=${IAM_JWT_ISSUER:${JWT_ISSUER:iam-service}}
authorization.jwt.key-id=${IAM_JWT_KEY_ID:${JWT_KEY_ID:iam-service-rsa-1}}
authorization.jwt.expiration.days=${IAM_JWT_EXPIRATION_DAYS:${JWT_EXPIRATION_DAYS:7}}
authorization.jwt.private-key=${IAM_JWT_PRIVATE_KEY:${JWT_PRIVATE_KEY:}}
authorization.jwt.public-key=${IAM_JWT_PUBLIC_KEY:${JWT_PUBLIC_KEY:}}
authorization.jwt.private-key-path=${IAM_JWT_PRIVATE_KEY_PATH:${JWT_PRIVATE_KEY_PATH:}}
authorization.jwt.public-key-path=${IAM_JWT_PUBLIC_KEY_PATH:${JWT_PUBLIC_KEY_PATH:}}
authorization.internal-service.secret=${IAM_INTERNAL_SERVICE_SECRET:internal-service-secret-key}
authorization.legacy-jwt.enabled=${LEGACY_JWT_ENABLED:true}
authorization.legacy-jwks.enabled=${LEGACY_JWKS_ENABLED:true}
auth0.issuer-uri=${AUTH0_ISSUER_URI:https://dev-e5ik5gbwpzkcqfrw.us.auth0.com/}
auth0.audience=${AUTH0_AUDIENCE:jameofit-api}
